# Local development only. Default password "bioresearch" is forbidden in
# production — use docker-compose.prod.yml with DB_PASSWORD set to a unique secret.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bioresearch
      POSTGRES_PASSWORD: bioresearch
      POSTGRES_DB: bioresearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioresearch -d bioresearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bioresearch:bioresearch@postgres:5432/bioresearch
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ollama:
    # GitHub ollama/ollama v0.33.3 (2026-09-03); Docker Hub 0.33.3
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  # OpenAI-compatible HTTP API (SGLang). Requires NVIDIA GPU + nvidia-container-toolkit on Linux.
  # Start: docker compose --profile inference up -d inference
  # Backend .env: LLM_PROVIDER=openai_compatible, OPENAI_BASE_URL=http://inference:30000/v1, OPENAI_MODEL=<same as INFERENCE_MODEL>
  inference:
    # GitHub sgl-project/sglang v0.5.19; Docker Hub lmsysorg/sglang:v0.5.19
    image: lmsysorg/sglang:v0.5.19@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    profiles:
      - inference
    ipc: host
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${INFERENCE_PORT:-30000}:30000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - "--model-path"
      - "${INFERENCE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000
    profiles:
      - frontend

volumes:
  postgres_data:
  ollama_data:
  huggingface_cache:
  pipeline_outputs:
