{{- if and .Values.backend.enabled (not .Values.backend.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bioresearch-assistant.fullname" . }}-backend
  labels:
    {{- include "bioresearch-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.secretEnv.DATABASE_URL | quote }}
  PSEUDONYMIZATION_ENCRYPTION_KEY: {{ .Values.backend.secretEnv.PSEUDONYMIZATION_ENCRYPTION_KEY | quote }}
  ANTHROPIC_API_KEY: {{ .Values.backend.secretEnv.ANTHROPIC_API_KEY | quote }}
  SECRET_KEY: {{ .Values.backend.secretEnv.SECRET_KEY | quote }}
  PUBMED_EMAIL: {{ .Values.backend.secretEnv.PUBMED_EMAIL | quote }}
{{- end }}

