{{- if .Values.postgres.enabled }}
{{- $pw := .Values.postgres.auth.password | default "" }}
{{- if or (eq $pw "") (eq $pw "bioresearch") }}
{{- fail "Set postgres.auth.password to a unique secret (must not be empty or 'bioresearch')" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bioresearch-assistant.fullname" . }}-postgres
  labels:
    {{- include "bioresearch-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
