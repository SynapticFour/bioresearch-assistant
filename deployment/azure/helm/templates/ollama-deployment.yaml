{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bioresearch-assistant.fullname" . }}-ollama
  labels:
    {{- include "bioresearch-assistant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bioresearch-assistant.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bioresearch-assistant.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ollama.service.port }}
          {{- if .Values.ollama.models.pullOnStart }}
          command: ["/bin/sh", "-c"]
          args:
            - >
              ollama serve &
              sleep 5;
              {{- range .Values.ollama.models.list }}
              ollama pull {{ . }} &&
              {{- end }}
              wait
          {{- end }}
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: ollama-data
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bioresearch-assistant.fullname" . }}-ollama
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}

