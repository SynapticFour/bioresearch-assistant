{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bioresearch-assistant.fullname" . }}-backend
  labels:
    {{- include "bioresearch-assistant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bioresearch-assistant.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bioresearch-assistant.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            {{- range $name, $value := .Values.backend.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.ollama.enabled }}
            - name: OLLAMA_BASE_URL
              value: "http://{{ include "bioresearch-assistant.fullname" . }}-ollama:11434"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ default (printf "%s-backend" (include "bioresearch-assistant.fullname" .)) .Values.backend.existingSecret }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}

