name: Build Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm"
        required: true
        default: ""
  workflow_call:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend image
        run: docker build -t bioresearch-assistant-backend:ci ./backend

      - name: Build Frontend image
        run: docker build -t bioresearch-assistant-frontend:ci ./frontend
