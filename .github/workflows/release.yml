name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      include_models_bundle:
        description: 'Build optional models-bundle (slow, large)'
        type: boolean
        default: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "BRA_RELEASE_VERSION=${TAG}" >> "$GITHUB_ENV"
          echo "BRA_VERSION=${TAG}" >> "$GITHUB_ENV"
          echo "Release version: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/synapticfour/bioresearch-assistant-backend:${{ env.BRA_RELEASE_VERSION }}
            ghcr.io/synapticfour/bioresearch-assistant-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/synapticfour/bioresearch-assistant-frontend:${{ env.BRA_RELEASE_VERSION }}
            ghcr.io/synapticfour/bioresearch-assistant-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build offline app bundle
        env:
          BRA_RELEASE_VERSION: ${{ env.BRA_RELEASE_VERSION }}
          BRA_VERSION: ${{ env.BRA_RELEASE_VERSION }}
        run: |
          chmod +x scripts/package_release_bundle.sh scripts/export_offline_bundle.sh import.sh install.sh
          ./scripts/package_release_bundle.sh

      - name: Build optional models bundle
        if: github.event_name == 'workflow_dispatch' && inputs.include_models_bundle == true
        env:
          BRA_VERSION: ${{ env.BRA_RELEASE_VERSION }}
          OLLAMA_MODELS: mistral
        run: |
          chmod +x scripts/export_models_bundle.sh
          ./scripts/export_models_bundle.sh --version "${BRA_VERSION}"

      - name: Generate SHA256SUMS for all release artifacts
        run: |
          shasum -a 256 \
            bra-offline-*.tar.gz \
            models-bundle-*.tar.gz \
            2>/dev/null | grep -v '^$' > SHA256SUMS.txt || true
          if [ ! -s SHA256SUMS.txt ]; then
            shasum -a 256 bra-offline-*.tar.gz > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Generate changelog snippet
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          CURRENT_TAG="${BRA_RELEASE_VERSION}"
          {
            echo "## BioResearch Assistant ${CURRENT_TAG}"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "### Changes since ${PREVIOUS_TAG}"
              git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" | head -50
            else
              git log --pretty=format:"- %s (%h)" | head -50
            fi
          } > release-notes.md
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BRA_RELEASE_VERSION }}
          name: BioResearch Assistant ${{ env.BRA_RELEASE_VERSION }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            bra-offline-*.tar.gz
            models-bundle-*.tar.gz
            SHA256SUMS.txt
            install.sh
            import.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
