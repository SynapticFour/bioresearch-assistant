name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # No postgres service — tests use SQLite in-memory and mocks
    env:
      TESTING: "1"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DEPLOYMENT: test
      ISOLATION_MODE: user
      PSEUDONYMIZATION_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SECRET_KEY: ci-secret-key-for-tests
      ENVIRONMENT: test

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r backend/requirements.lock

      - name: Run tests with coverage
        working-directory: backend
        # Align with backend/pytest.ini and backend/pyproject.toml (--cov-fail-under=72).
        # Existing coverage.xml floor ~73%; raise toward 80 when tests allow.
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=72

  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app/ tests/
        working-directory: backend

      - name: Ruff format check
        run: ruff format --check app/ tests/
        working-directory: backend

  frontend:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Unit tests
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:8000

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    name: pip-audit + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: pip-audit (backend requirements)
        run: |
          python -m pip install --upgrade pip pip-audit
          # sentence-transformers 2.x pins transformers 4.x. PYSEC-2025-217 has no
          # upstream fix; 2288/2289/2290 require transformers 5.x (major, not taken).
          pip-audit -r backend/requirements.lock \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend production)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
