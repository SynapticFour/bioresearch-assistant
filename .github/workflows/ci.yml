name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No postgres service — tests use SQLite in-memory and mocks
    env:
      TESTING: "1"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DEPLOYMENT: test
      ISOLATION_MODE: open
      PSEUDONYMIZATION_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SECRET_KEY: ci-secret-key-for-tests
      ENVIRONMENT: test

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=0

      - name: Generate coverage badge
        run: |
          cd backend
          mkdir -p ../docs
          genbadge coverage \
            --input-file coverage.xml \
            --output-file ../docs/coverage-badge.svg

      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update coverage badge"
          file_pattern: docs/coverage-badge.svg
          skip_dirty_check: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app/
        working-directory: backend

      - name: Ruff format check
        run: ruff format --check app/
        working-directory: backend

  conformance-ga4gh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TESTING: "1"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DEPLOYMENT: test
      ISOLATION_MODE: open
      PSEUDONYMIZATION_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SECRET_KEY: ci-secret-key-for-tests
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: GA4GH conformance smoke (DRS/WES/Phenopackets/Auth)
        working-directory: backend
        run: >
          pytest
          tests/test_drs_endpoints.py
          tests/test_drs_endpoint_extended.py
          tests/test_drs_service.py
          tests/test_wes_api.py
          tests/test_wes_service.py
          tests/test_wes_service_extended.py
          tests/test_wes_service_workflows.py
          tests/test_phenopackets.py
          tests/test_auth.py
          -v
          --cov=app
          --cov-fail-under=0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:8000

