name: Conformance

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  mii-fhir-ig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache FHIR validator CLI + package cache
        uses: actions/cache@v5
        with:
          path: .cache/fhir
          key: fhir-validator-${{ runner.os }}-${{ hashFiles('backend/app/interoperability/mii/ig_manifest.json') }}

      - name: Validate sample FHIR Bundle (R4 + MII Kerndatensatz Meta IG)
        run: |
          chmod +x scripts/validate_fhir_bundle.sh
          ./scripts/validate_fhir_bundle.sh backend/tests/fixtures/mii/sample-bundle.json

  conformance-ga4gh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TESTING: "1"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DEPLOYMENT: test
      ISOLATION_MODE: open
      PSEUDONYMIZATION_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SECRET_KEY: ci-secret-key-for-tests
      ENVIRONMENT: test
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r backend/requirements.txt

      - name: GA4GH conformance smoke (DRS/WES/Phenopackets/Auth)
        working-directory: backend
        run: >
          pytest
          tests/test_drs_endpoints.py
          tests/test_drs_endpoint_extended.py
          tests/test_drs_service.py
          tests/test_drs_access_url.py
          tests/test_wes_api.py
          tests/test_wes_service.py
          tests/test_wes_service_extended.py
          tests/test_wes_service_workflows.py
          tests/test_wes_helixtest_trs.py
          tests/test_phenopackets.py
          tests/test_auth.py
          -v
          --cov=app
          --cov-fail-under=0

  helixtest-ga4gh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSEUDONYMIZATION_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      SECRET_KEY: "ci-secret-key-for-tests-min-32-characters-long!!"
      DATABASE_URL: sqlite+aiosqlite:////tmp/bioresearch_helixtest.db
      DRS_STORAGE_PATH: /tmp/bioresearch_helixtest_drs
      WES_WORK_DIR: /tmp/bioresearch_helixtest_wes
      DRS_BASE_URL: http://127.0.0.1:8080/ga4gh/drs/v1
      DEPLOYMENT: test
      ISOLATION_MODE: open
      ENVIRONMENT: test
      OIDC_ISSUER: http://127.0.0.1:8199
      OIDC_CLIENT_ID: helixtest-audience
      OIDC_CLIENT_SECRET: ""
      ANTHROPIC_API_KEY: ""
      HELIXTEST_REF: fbfe207f8961d5e8909b9173c07a7e001c24f2ad

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r backend/requirements.txt

      - name: Prepare HelixTest DRS object (test-object-1)
        run: |
          mkdir -p "$DRS_STORAGE_PATH"
          printf '%s\n' 'helixtest-conformance-object' > "$DRS_STORAGE_PATH/test-object-1"

      - name: Clone and patch HelixTest
        run: |
          git clone https://github.com/SynapticFour/HelixTest.git "${RUNNER_TEMP}/helixtest"
          git -C "${RUNNER_TEMP}/helixtest" checkout "${HELIXTEST_REF}"
          git -C "${RUNNER_TEMP}/helixtest" apply --check \
            "${GITHUB_WORKSPACE}/scripts/helixtest-patches/0001-default-bearer-for-confidential-drs-wes.patch"
          git -C "${RUNNER_TEMP}/helixtest" apply \
            "${GITHUB_WORKSPACE}/scripts/helixtest-patches/0001-default-bearer-for-confidential-drs-wes.patch"

      - name: Start OIDC stub (JWKS) and export bearer tokens
        run: |
          python backend/scripts/ci_oidc_for_helixtest.py \
            --state-dir /tmp/bioresearch_oidc_ci \
            --listen-port 8199 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8199/.well-known/openid-configuration && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8199/.well-known/openid-configuration
          TOKEN="$(tr -d '\n\r' < /tmp/bioresearch_oidc_ci/bearer.token)"
          {
            echo "TEST_BEARER<<__HELIXTOK__"
            echo "$TOKEN"
            echo "__HELIXTOK__"
            echo "HELIXTEST_DEFAULT_BEARER<<__HELIXTOK2__"
            echo "$TOKEN"
            echo "__HELIXTOK2__"
          } >> "$GITHUB_ENV"

      - name: Alembic migrate and start API on :8080
        working-directory: backend
        run: |
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/v1/health

      - name: HelixTest (--profile bioresearch-assistant)
        env:
          WES_URL: http://127.0.0.1:8080/ga4gh/wes/v1
          DRS_URL: http://127.0.0.1:8080/ga4gh/drs/v1
        run: |
          cd "${RUNNER_TEMP}/helixtest"
          cargo run -p helixtest-cli --bin helixtest -- \
            --all \
            --profile bioresearch-assistant \
            --mode generic \
            --report json \
            --fail-level 1
