# BioResearch Assistant — Vollständiges Docker Setup
# Referenz: Nutze .env für Secrets (wird von install.py generiert).
# Siehe docs/INSTALL.md

version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bioresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bioresearch
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioresearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - drs_data:/data/drs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_APP_VERSION: ${APP_VERSION:-1.3.0}
        VITE_DEPLOYMENT: local
        VITE_INSTITUTION: ${INSTITUTION:-Meine Institution}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  blast:
    image: ncbi/blast:latest
    volumes:
      - blast_data:/blast/db
    restart: unless-stopped

  nextflow:
    image: nextflow/nextflow:24.10.6
    volumes:
      - nextflow_data:/workspace
    restart: unless-stopped

volumes:
  postgres_data:
  drs_data:
  blast_data:
  nextflow_data:
  ollama_data:
