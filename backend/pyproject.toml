# Canonical install lockfiles are requirements.txt and requirements.lock
# (uv pip compile --generate-hashes). This Poetry lock is an unused stub.
[project]
name = "bioresearch-assistant-backend"
version = "1.3.0"
description = "BioResearch Assistant API"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
