# Alembic configuration for BioResearch Assistant
# DATABASE_URL is read from app settings (env.py); this url is a fallback for tools that parse .ini only.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/bioresearch

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# Uncomment to run black on generated migration files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
