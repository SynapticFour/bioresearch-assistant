target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["B008", "UP042"]

exclude = ["alembic/"]

# Tests: lockere ANN-Anforderungen (Fixtures, Pytest-Argumente)
[lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN101", "ANN102"]

[lint.isort]
known-first-party = ["app"]
