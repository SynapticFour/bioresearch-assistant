version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_USER: ${DB_USER:-bioresearch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a unique secret (not bioresearch)}
      POSTGRES_DB: ${DB_NAME:-bioresearch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioresearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/synapticfour/bioresearch-assistant-backend:${BRA_VERSION}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-bioresearch}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-bioresearch}
      PSEUDONYMIZATION_ENCRYPTION_KEY: ${PSEUDONYMIZATION_ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      OLLAMA_BASE_URL: http://ollama:11434
      PUBMED_EMAIL: ${PUBMED_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    ports:
      - "8000:8000"

  frontend:
    image: ghcr.io/synapticfour/bioresearch-assistant-frontend:${BRA_VERSION}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.13}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '1.5'

volumes:
  postgres_data:
  ollama_data:
